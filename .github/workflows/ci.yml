name: Phase guardrails
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      APP_ENV: test
    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned LTS Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run secret-scan
      - run: npm run audit
      - run: npm run build
        env:
          NODE_ENV: production
          APP_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install test browser on the managed CI runner
        run: npx --no-install playwright install chromium
      - name: Verify browser authentication against disposable isolated MySQL
        env:
          NODE_ENV: development
          APP_ENV: development
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/local-mysql.py start
          python3 scripts/local-mysql.py browser
          task_tools="$RUNNER_TEMP/bismillah-tools"
          if [ -w /workspace ]; then task_tools=/workspace/.tools; fi
          node --env-file="$task_tools/phase2a-mysql/browser.env" node_modules/@playwright/test/cli.js test
      - name: Stop disposable browser database
        if: always()
        run: python3 scripts/local-mysql.py stop
      # Authentication runs intentionally upload no browser traces, snapshots,
      # storage state, credentials, database logs or test-result artifacts.
  mysql-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start temporary rootless MySQL, migrate isolated schemas, and restrict runtime grants
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/local-mysql.py start
          task_tools="$RUNNER_TEMP/bismillah-tools"
          if [ -w /workspace ]; then task_tools=/workspace/.tools; fi
          for mode in development test; do
            node --env-file="$task_tools/phase2a-mysql/$mode.env" scripts/database.mjs migrate
            node --env-file="$task_tools/phase2a-mysql/$mode.env" scripts/database.mjs seed
          done
          python3 scripts/local-mysql.py grants
          node --env-file="$task_tools/phase2a-mysql/test.env" scripts/database.mjs test
      - name: Stop temporary MySQL
        if: always()
        run: python3 scripts/local-mysql.py stop
